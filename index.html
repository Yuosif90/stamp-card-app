<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>کارتا مۆران</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: none;
    }

    .card {
      background: white;
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
      text-align: center;
      width: 88%;
      max-width: 380px;
      position: relative;
    }

    h2 {
      margin: 0 0 8px 0;
      color: #0f172a;
      font-size: 26px;
    }

    p {
      color: #475569;
      font-size: 15px;
      margin: 0 0 25px 0;
    }

    /* شاشەی داغڵکردنی ژمارەی مۆبایل */
    #auth-screen {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="tel"] {
      width: 100%;
      padding: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 18px;
      text-align: center;
      direction: ltr;
      outline: none;
      background: #f8fafc;
    }

    input[type="tel"]:focus {
      border-color: #0d9488;
      background: #fff;
    }

    .btn-submit {
      background: #0d9488;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    /* شاشەی کارتی مۆرەکان */
    #stamp-screen {
      display: none;
    }

    .user-info {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
      direction: ltr;
    }

    .stamps-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .slot {
      aspect-ratio: 1;
      border: 2px dashed #cbd5e1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #94a3b8;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slot.active {
      background: #0d9488;
      border: 2px solid #0d9488;
      color: white;
      transform: scale(1.04);
    }

    #touch-area {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 18px;
      padding: 18px;
      font-size: 16px;
      font-weight: 600;
      color: #475569;
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- بەشی یەکەم: تۆمارکردنی ژمارە -->
    <div id="auth-screen">
      <h2>بەخێربێیت</h2>
      <p>تکایە ژمارەی مۆبایلەکەت بنووسە بۆ چالاککردنی کارتی خەڵات</p>
      <input type="tel" id="phone-input" placeholder="0750 000 0000" maxlength="11" />
      <button class="btn-submit" onclick="registerUser()">دەستپێبکە</button>
    </div>

    <!-- بەشی دووەم: کارتی مۆرەکان -->
    <div id="stamp-screen">
      <h2>کارتا مۆران</h2>
      <div class="user-info" id="display-phone"></div>
      <p id="status-desc">مۆرا دارین ل دەڤەرا ل خارێ بدە</p>

      <div class="stamps-container">
        <div class="slot" id="s1">1</div>
        <div class="slot" id="s2">2</div>
        <div class="slot" id="s3">3</div>
        <div class="slot" id="s4">4</div>
        <div class="slot" id="s5">5</div>
        <div class="slot" id="s6">🎁</div>
      </div>

      <div id="touch-area">جهێ لێدانا مۆرێ</div>
    </div>

  </div>

  <script>
    let currentPhone = "";
    let stampCount = 0;
    const maxStamps = 6;
    let isProcessing = false;

    const authScreen = document.getElementById('auth-screen');
    const stampScreen = document.getElementById('stamp-screen');
    const phoneInput = document.getElementById('phone-input');
    const displayPhone = document.getElementById('display-phone');
    const touchArea = document.getElementById('touch-area');

    // لێرە پشکنین دەکات کاتێک پەڕەکە دەکرێتەوە ئایا ژمارەکە تۆمارکراوە
    window.addEventListener('DOMContentLoaded', () => {
      const savedPhone = localStorage.getItem('loyalty_phone');
      if (savedPhone) {
        showCard(savedPhone);
      }
    });

    // تۆمارکردنی کڕیار
    async function registerUser() {
      const phone = phoneInput.value.trim();
      if (!phone || phone.length < 10) {
        alert("تکایە ژمارەیەکی دروست بنووسە");
        return;
      }
      
      localStorage.setItem('loyalty_phone', phone);
      showCard(phone);
    }

    // پیشاندانی کارتەکە و وەرگرتنەوەی زانیارییەکانی لە سێرڤەر
    async function showCard(phone) {
      currentPhone = phone;
      authScreen.style.display = 'none';
      stampScreen.style.display = 'block';
      displayPhone.textContent = "کڕیار: " + phone;

      // پەیوەندی کردن بە سێرڤەر بۆ هێنانی ژمارەی مۆرەکان
      try {
        const res = await fetch('/api/stamp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: currentPhone, action: 'get' })
        });
        const data = await res.json();
        if (data && data.stamps !== undefined) {
          stampCount = data.stamps;
          updateUI();
        }
      } catch (err) {
        console.log("هەڵە لە وەرگرتنی داتا:", err);
      }
    }

    // سیستەمی بەرکەوتنی مۆری دارین لەسەر شاشە (Touch Event)
    touchArea.addEventListener('touchstart', function(e) {
      if (e.touches.length === 3 && !isProcessing) {
        e.preventDefault();

        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const t3 = e.touches[2];

        const d1 = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        const d2 = Math.hypot(t2.clientX - t3.clientX, t2.clientY - t3.clientY);
        const d3 = Math.hypot(t3.clientX - t1.clientX, t3.clientY - t1.clientY);

        if (d1 > 20 && d2 > 20 && d3 > 20) {
          applyStamp();
        }
      }
    }, { passive: false });

    // لێدانی مۆرەکە و ناردنی بۆ سێرڤەر
    async function applyStamp() {
      if (isProcessing) return;
      isProcessing = true;

      if (navigator.vibrate) navigator.vibrate(80);

      touchArea.textContent = 'مۆر دەدرێت...';

      try {
        const res = await fetch('/api/stamp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: currentPhone, action: 'stamp' })
        });
        const data = await res.json();
        
        if (data && data.stamps !== undefined) {
          stampCount = data.stamps;
          updateUI();
          touchArea.textContent = 'مۆر سەرکەوتووانە لێدرا!';
          touchArea.style.borderColor = '#0d9488';
          touchArea.style.color = '#0d9488';
        }
      } catch (err) {
        touchArea.textContent = 'کێشەیەک لە سێرڤەر ڕوویدا';
      }

      setTimeout(() => {
        isProcessing = false;
        resetTouchAreaText();
      }, 2000);
    }

    function updateUI() {
      for (let i = 1; i <= maxStamps; i++) {
        const slot = document.getElementById(`s${i}`);
        if (i <= stampCount) {
          slot.classList.add('active');
          slot.textContent = '✓';
        } else {
          slot.classList.remove('active');
          slot.textContent = i === maxStamps ? '🎁' : i;
        }
      }
      resetTouchAreaText();
    }

    function resetTouchAreaText() {
      if (stampCount === 0 && localStorage.getItem('reward_ready')) {
        touchArea.textContent = 'پیرۆزە! تە خەلات بدەستڤە ئینا 🎉';
      } else {
        touchArea.textContent = 'جهێ لێدانا مۆرێ';
        touchArea.style.borderColor = '#e2e8f0';
        touchArea.style.color = '#475569';
      }
    }
  </script>
</body>
</html>
