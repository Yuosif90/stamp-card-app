<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>کارتا مۆران یا زیرەک</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: pan-y;
    }

    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 26px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
      width: 90%;
      max-width: 360px;
      position: relative;
    }

    h2 {
      margin: 0 0 8px 0;
      color: #0f172a;
      font-size: 24px;
    }

    p {
      color: #64748b;
      font-size: 14px;
      margin: 0 0 20px 0;
      line-height: 1.5;
    }

    #auth-screen {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="tel"], input[type="password"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      font-size: 18px;
      text-align: center;
      direction: ltr;
      outline: none;
      background: #f8fafc;
    }

    input:focus {
      border-color: #0d9488;
      background: #fff;
    }

    .btn-submit {
      background: #0d9488;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #stamp-screen {
      display: none;
    }

    .user-info {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 15px;
      direction: ltr;
    }

    .stamps-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

    .slot {
      aspect-ratio: 1;
      border: 2px dashed #cbd5e1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #94a3b8;
      transition: all 0.2s ease;
      background: #ffffff;
    }

    .slot.active {
      background: #0d9488 !important;
      border: 2px solid #0d9488 !important;
      color: white !important;
      transform: scale(1.05);
    }

    .btn-cashier {
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2);
    }

    #pin-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: white;
      padding: 25px;
      border-radius: 20px;
      width: 85%;
      max-width: 300px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- شاشا ١: تۆمارکرن -->
    <div id="auth-screen">
      <h2>ب خێر هاتی</h2>
      <p>ژمارا تەلەفۆنا خۆ بنڤیسە دا کارتا تە دەستپێبکەت</p>
      <input type="tel" id="phone-input" placeholder="0750 000 0000" maxlength="11" />
      <button class="btn-submit" onclick="registerUser()">دەستپێبکە</button>
    </div>

    <!-- شاشا ٢: کارتا مۆران -->
    <div id="stamp-screen">
      <h2>کارتا مۆران</h2>
      <div class="user-info" id="display-phone"></div>
      <p id="status-text">تەلەفۆنێ نێزیکی کارتا NFC بکە یان بدە دەستێ کاشێری</p>

      <div class="stamps-container">
        <div class="slot" id="s1">1</div>
        <div class="slot" id="s2">2</div>
        <div class="slot" id="s3">3</div>
        <div class="slot" id="s4">4</div>
        <div class="slot" id="s5">5</div>
        <div class="slot" id="s6">🎁</div>
      </div>

      <button class="btn-cashier" onclick="openPinModal()">لێدانا مۆرێ (تایبەت ب کاشێری)</button>
    </div>

  </div>

  <!-- پەنجەرا پاسۆردێ کاشێری -->
  <div id="pin-modal">
    <div class="modal-box">
      <h3 style="margin-top:0">کۆدێ نهێنی یێ کاشێری</h3>
      <input type="password" id="cashier-pin" placeholder="****" maxlength="4" autofocus />
      <div style="display:flex; gap:10px; margin-top:15px;">
        <button class="btn-submit" style="flex:1" onclick="verifyPin()">پەژراندن</button>
        <button class="btn-submit" style="flex:1; background:#94a3b8" onclick="closePinModal()">زڤڕین</button>
      </div>
    </div>
  </div>

  <script>
    const CASHIER_SECRET_PIN = "1234";

    let currentPhone = "";
    let stampCount = 0;
    const maxStamps = 6;

    const authScreen = document.getElementById('auth-screen');
    const stampScreen = document.getElementById('stamp-screen');
    const phoneInput = document.getElementById('phone-input');
    const displayPhone = document.getElementById('display-phone');
    const pinModal = document.getElementById('pin-modal');
    const cashierPinInput = document.getElementById('cashier-pin');
    const statusText = document.getElementById('status-text');

    window.addEventListener('DOMContentLoaded', () => {
      const savedPhone = localStorage.getItem('loyalty_phone');
      
      const urlParams = new URLSearchParams(window.location.search);
      const hasNfcToken = urlParams.get('stamp_token') === 'cafe_nfc_secure_2026';

      if (hasNfcToken) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      if (savedPhone) {
        openCard(savedPhone);
        if (hasNfcToken) {
          applyStampSuccess();
        }
      }
    });

    function registerUser() {
      const phone = phoneInput.value.trim();
      if (!phone || phone.length < 10) {
        alert("تکایە ژمارەکا دروست بنڤیسە");
        return;
      }
      localStorage.setItem('loyalty_phone', phone);
      openCard(phone);
    }

    function openCard(phone) {
      currentPhone = phone;
      authScreen.style.display = 'none';
      stampScreen.style.display = 'block';
      displayPhone.textContent = "کڕیار: " + phone;

      stampCount = parseInt(localStorage.getItem('loyalty_stamps_' + currentPhone) || "0");
      renderStamps();

      fetch('/api/stamp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentPhone, action: 'get' })
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.stamps !== undefined) {
          stampCount = data.stamps;
          localStorage.setItem('loyalty_stamps_' + currentPhone, stampCount);
          renderStamps();
        }
      }).catch(err => {});
    }

    function openPinModal() {
      cashierPinInput.value = "";
      pinModal.style.display = "flex";
      cashierPinInput.focus();
    }

    function closePinModal() {
      pinModal.style.display = "none";
    }

    function verifyPin() {
      if (cashierPinInput.value === CASHIER_SECRET_PIN) {
        closePinModal();
        applyStampSuccess();
      } else {
        alert("کۆدێ نهێنی خەلەتە!");
        cashierPinInput.value = "";
      }
    }

    async function applyStampSuccess() {
      // دەستبەجێ ل سەر شاشەی مۆرێ کەسک دکەت و لەرزینێ ددەت (بێی گیرۆبوون)
      if (stampCount < maxStamps) {
        stampCount++;
      } else {
        stampCount = 1;
      }
      localStorage.setItem('loyalty_stamps_' + currentPhone, stampCount);
      renderStamps();

      if (navigator.vibrate) navigator.vibrate(100);

      statusText.textContent = "مۆر سەرکەفتیانە هاتە لێدان! ✓";
      statusText.style.color = "#0d9488";
      statusText.style.fontWeight = "bold";

      setTimeout(() => {
        statusText.textContent = "تەلەفۆنێ نێزیکی کارتا NFC بکە یان بدە دەستێ کاشێری";
        statusText.style.color = "#64748b";
        statusText.style.fontWeight = "normal";
      }, 3000);

      // ل پشت پەردێ زانیارییان بۆ سێرڤەری فرێدکەت
      try {
        const res = await fetch('/api/stamp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: currentPhone, action: 'stamp' })
        });
        
        const data = await res.json();

        // ئەگەر کڕیار بەری ٣٠ خولەکان هاتبیت
        if (res.status === 429) {
          alert(data.message);
          stampCount--;
          localStorage.setItem('loyalty_stamps_' + currentPhone, stampCount);
          renderStamps();
          statusText.textContent = data.message;
          statusText.style.color = "#dc2626";
          return;
        }

        if (data && data.stamps !== undefined) {
          stampCount = data.stamps;
          localStorage.setItem('loyalty_stamps_' + currentPhone, stampCount);
          renderStamps();
        }
      } catch (err) {
        console.log("خەلەتی د سێرڤەری دا:", err);
      }
    }

    function renderStamps() {
      for (let i = 1; i <= maxStamps; i++) {
        const slot = document.getElementById(`s${i}`);
        if (i <= stampCount) {
          slot.classList.add('active');
          slot.textContent = '✓';
        } else {
          slot.classList.remove('active');
          slot.textContent = i === maxStamps ? '🎁' : i;
        }
      }
    }
  </script>
</body>
</html>
