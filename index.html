<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>کارتا مۆران</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: pan-y;
    }

    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
      width: 90%;
      max-width: 360px;
    }

    h2 {
      margin: 0 0 8px 0;
      color: #0f172a;
      font-size: 24px;
    }

    p {
      color: #64748b;
      font-size: 14px;
      margin: 0 0 20px 0;
    }

    /* شاشا داخوازکرنا ژمارێ */
    #auth-screen {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="tel"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      font-size: 18px;
      text-align: center;
      direction: ltr;
      outline: none;
      background: #f8fafc;
    }

    input[type="tel"]:focus {
      border-color: #0d9488;
      background: #fff;
    }

    .btn-submit {
      background: #0d9488;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* شاشا مۆران */
    #stamp-screen {
      display: none;
    }

    .user-info {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 15px;
      direction: ltr;
    }

    .stamps-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

    .slot {
      aspect-ratio: 1;
      border: 2px dashed #cbd5e1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #94a3b8;
      transition: all 0.2s ease;
      background: #ffffff;
    }

    .slot.active {
      background: #0d9488 !important;
      border: 2px solid #0d9488 !important;
      color: white !important;
      transform: scale(1.05);
    }

    /* دەڤەرا لێدانا مۆرێ */
    #touch-area {
      background: #f1f5f9;
      border: 2px dashed #0d9488;
      border-radius: 16px;
      padding: 22px;
      font-size: 16px;
      font-weight: bold;
      color: #0d9488;
      touch-action: none; /* ناهێلیت دەست لێدان لاپەری بلڤینیت */
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- شاشا ئێکێ: نڤیسینا ژمارێ -->
    <div id="auth-screen">
      <h2>ب خێر هاتی</h2>
      <p>ژمارا تەلەفۆنا خۆ بنڤیسە دا کارتا تە دەستپێبکەت</p>
      <input type="tel" id="phone-input" placeholder="0750 000 0000" maxlength="11" />
      <button class="btn-submit" onclick="registerUser()">دەستپێبکە</button>
    </div>

    <!-- شاشا دووێ: کارتا مۆران -->
    <div id="stamp-screen">
      <h2>کارتا مۆران</h2>
      <div class="user-info" id="display-phone"></div>
      <p>مۆرا دارین (یان ۳ تلان بێکڤە) ل ڤێرێ بدە</p>

      <div class="stamps-container">
        <div class="slot" id="s1">1</div>
        <div class="slot" id="s2">2</div>
        <div class="slot" id="s3">3</div>
        <div class="slot" id="s4">4</div>
        <div class="slot" id="s5">5</div>
        <div class="slot" id="s6">🎁</div>
      </div>

      <div id="touch-area">جهێ لێدانا مۆرێ</div>
    </div>

  </div>

  <script>
    let currentPhone = "";
    let stampCount = 0;
    const maxStamps = 6;
    let isLocked = false;

    const authScreen = document.getElementById('auth-screen');
    const stampScreen = document.getElementById('stamp-screen');
    const phoneInput = document.getElementById('phone-input');
    const displayPhone = document.getElementById('display-phone');
    const touchArea = document.getElementById('touch-area');

    // ل دەستپێکێ تەماشەی LocalStorage دکەت
    window.addEventListener('DOMContentLoaded', () => {
      const savedPhone = localStorage.getItem('loyalty_phone');
      if (savedPhone) {
        openCard(savedPhone);
      }
    });

    function registerUser() {
      const phone = phoneInput.value.trim();
      if (!phone || phone.length < 10) {
        alert("تکایە ژمارەکا دروست بنڤیسە");
        return;
      }
      localStorage.setItem('loyalty_phone', phone);
      openCard(phone);
    }

    function openCard(phone) {
      currentPhone = phone;
      authScreen.style.display = 'none';
      stampScreen.style.display = 'block';
      displayPhone.textContent = "کڕیار: " + phone;

      // خواندنا هژمارا مۆران ژ تەلەفۆنێ
      stampCount = parseInt(localStorage.getItem('loyalty_stamps_' + currentPhone) || "0");
      renderStamps();

      // پشکنین دگەل سێرڤەری (ئەگەر هەبیت)
      fetch('/api/stamp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentPhone, action: 'get' })
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.stamps !== undefined) {
          stampCount = data.stamps;
          localStorage.setItem('loyalty_stamps_' + currentPhone, stampCount);
          renderStamps();
        }
      })
      .catch(err => console.log("سێرڤەر نەهاتە دیتن، کار ل سەر میمۆرییا تەلەفۆنێ دکەت."));
    }

    // لێدانا مۆرێ ب ۳ تلان (Touch)
    touchArea.addEventListener('touchstart', function(e) {
      if (isLocked) return;

      // ئەگەر ۳ تل (یان زێدەتر) بەر شاشەی بکەڤن
      if (e.touches.length >= 3) {
        e.preventDefault();
        applyStamp();
      }
    }, { passive: false });

    // لێدانا مۆرێ و کەسک کرن
    function applyStamp() {
      if (isLocked) return;
      isLocked = true;

      if (stampCount < maxStamps) {
        stampCount++;
      } else {
        stampCount = 1; // ئەگەر تژێ بوو، ژ نوی دەستپێدکەت
      }

      // پاشکەفتکرن
      localStorage.setItem('loyalty_stamps_' + currentPhone, stampCount);
      renderStamps();

      // ڤایبرەیشن دەمێ کەسک دبیت
      if (navigator.vibrate) navigator.vibrate(100);

      touchArea.textContent = 'مۆر سەرکەفتیانە لێدرا! ✓';
      touchArea.style.background = '#0d9488';
      touchArea.style.color = '#ffffff';

      // فرێکرن بۆ سێرڤەری ل پشت پەردێ
      fetch('/api/stamp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentPhone, action: 'stamp' })
      }).catch(err => console.log("سێرڤەر ئۆفلاینە"));

      // پشتی ۱.٥ چرکەیان دزڤڕیتە باری ئاسایی
      setTimeout(() => {
        isLocked = false;
        if (stampCount === maxStamps) {
          touchArea.textContent = 'پیرۆزە! تە خەلات بدەستڤە ئینا 🎉';
        } else {
          touchArea.textContent = 'جهێ لێدانا مۆرێ';
        }
        touchArea.style.background = '#f1f5f9';
        touchArea.style.color = '#0d9488';
      }, 1500);
    }

    function renderStamps() {
      for (let i = 1; i <= maxStamps; i++) {
        const slot = document.getElementById(`s${i}`);
        if (i <= stampCount) {
          slot.classList.add('active');
          slot.textContent = '✓';
        } else {
          slot.classList.remove('active');
          slot.textContent = i === maxStamps ? '🎁' : i;
        }
      }
    }
  </script>
</body>
</html>
